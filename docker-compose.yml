version: '3.9'

services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: webhook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webhook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-webhook}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webhook}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

  # ==========================================================================
  # Redis Cache & Queue
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: webhook-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256M

  # ==========================================================================
  # API Server (Go/Fiber)
  # ==========================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    container_name: webhook-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${API_PORT:-2200}:${API_PORT:-2200}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${API_PORT:-2200}/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256M

  # ==========================================================================
  # DNS Service
  # ==========================================================================
  dns:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dns
    container_name: webhook-dns
    restart: unless-stopped
    env_file: .env
    ports:
      - "${DNS_PORT:-2500}:${DNS_PORT:-2500}/udp"
      - "${DNS_PORT:-2500}:${DNS_PORT:-2500}/tcp"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128M

  # ==========================================================================
  # SMTP Service
  # ==========================================================================
  smtp:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: smtp
    container_name: webhook-smtp
    restart: unless-stopped
    env_file: .env
    ports:
      - "${SMTP_PORT:-2600}:${SMTP_PORT:-2600}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128M

  # ==========================================================================
  # Worker (Cleanup & Aggregation)
  # ==========================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    container_name: webhook-worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128M

  # ==========================================================================
  # Frontend (Next.js)
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: webhook-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://${API_DOMAIN:-api.webhook.inst.lk}
      - NEXT_PUBLIC_WS_URL=wss://${WS_DOMAIN:-ws.webhook.inst.lk}
      - NEXT_PUBLIC_DOMAIN=${DOMAIN:-webhook.inst.lk}
      - PORT=${FRONTEND_PORT:-2100}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-2100}:${FRONTEND_PORT:-2100}"
    depends_on:
      - api
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256M

  # ==========================================================================
  # Nginx Reverse Proxy
  # ==========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: webhook-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/ssl:/etc/ssl/webhook:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - frontend
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
