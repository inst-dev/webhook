# =============================================================================
# Main domain - webhook.inst.lk (Frontend + Webhook capture)
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name webhook.inst.lk *.webhook.inst.lk;

    # Redirect to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name webhook.inst.lk;

    ssl_certificate /etc/ssl/webhook/fullchain.pem;
    ssl_certificate_key /etc/ssl/webhook/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Frontend
    location / {
        proxy_pass http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets
    location /_next/static {
        proxy_pass http://frontend_backend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }
}

# Wildcard subdomain webhook capture
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.webhook.inst.lk;

    ssl_certificate /etc/ssl/webhook/fullchain.pem;
    ssl_certificate_key /etc/ssl/webhook/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Route all traffic to API for capture
    location / {
        limit_req zone=webhook burst=100 nodelay;
        
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =============================================================================
# API domain - api.webhook.inst.lk
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.webhook.inst.lk;

    ssl_certificate /etc/ssl/webhook/fullchain.pem;
    ssl_certificate_key /etc/ssl/webhook/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # API routes
    location / {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Auth endpoints with stricter rate limiting
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (no rate limit)
    location /health {
        proxy_pass http://api_backend;
        access_log off;
    }
}

# =============================================================================
# WebSocket domain - ws.webhook.inst.lk
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ws.webhook.inst.lk;

    ssl_certificate /etc/ssl/webhook/fullchain.pem;
    ssl_certificate_key /etc/ssl/webhook/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /ws {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

# =============================================================================
# Admin Console - console.webhook.inst.lk
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.webhook.inst.lk;

    ssl_certificate /etc/ssl/webhook/fullchain.pem;
    ssl_certificate_key /etc/ssl/webhook/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Restrict access (add IP whitelist in production)
    # allow 10.0.0.0/8;
    # deny all;

    location / {
        proxy_pass http://frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
